name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

concurrency:
  group: wikigolf-windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: v0.1.0
      RELEASE_ZIP: WikiGOLF-Windows-x64.zip
      BUILD_DIR: build-release
    steps:
      - name: Checkout source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure LFS objects are present
        shell: pwsh
        run: git lfs pull

      - name: Configure Release
        shell: pwsh
        run: >
          cmake -S . -B $env:BUILD_DIR -A x64
          -DWIKIGOLF_STATIC_BUILD=OFF
          -DWIKIGOLF_DEBUG_TOOLS=OFF
          -DWIKIGOLF_PROFILING=OFF
          -DWIKIGOLF_DISABLE_LOGGING=ON

      - name: Build game
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --target DX_GAME --config Release --parallel

      - name: Prepare package
        shell: pwsh
        run: |
          $out = ".\$env:BUILD_DIR\Release"
          $exe = Join-Path $out "WikiGolf.exe"
          $assimp = Join-Path $out "assimp-vc143-mt.dll"
          if (-not (Test-Path $exe)) { throw "WikiGolf.exe was not produced at $exe" }
          if (-not (Test-Path $assimp)) { throw "Assimp runtime DLL was not bundled at $assimp" }

          $data = Join-Path $out "Assets\data"
          Remove-Item (Join-Path $data "jawiki_sdow-001_part1.sqlite") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $data "jawiki_sdow-001_part2.sqlite") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $data "jawiki_sdow-001_part3.sqlite") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $data "jawiki_sdow.sqlite") -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $data "backup_old_db") -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force ".\package\WikiGOLF" | Out-Null
          Copy-Item "$out\*" ".\package\WikiGOLF" -Recurse -Force
          Get-Item $exe, $assimp | Format-Table FullName,Length

      - name: Package with Zip64
        shell: pwsh
        run: |
          & 7z a -tzip -mx=9 $env:RELEASE_ZIP ".\package\WikiGOLF"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          $size = (Get-Item $env:RELEASE_ZIP).Length
          if ($size -ge 2147483648) {
            throw "Release asset exceeds GitHub's 2 GiB per-file limit: $size bytes"
          }
          $hash = Get-FileHash $env:RELEASE_ZIP -Algorithm SHA256
          "$($hash.Hash.ToLower())  $env:RELEASE_ZIP" | Set-Content -Encoding ascii -NoNewline SHA256SUMS.txt
          Get-Item $env:RELEASE_ZIP | Format-List FullName,Length
          Get-Content SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows x64 Release build of WikiGOLF.

          - Built from the repository master branch
          - assimp runtime DLL bundled
          - Required game assets and third-party license notices included
          - Runtime logging/profiling/debug tools disabled for distribution

          Verify the archive with SHA256SUMS.txt.
          "@
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ZIP SHA256SUMS.txt --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ZIP SHA256SUMS.txt --title "WikiGOLF $env:RELEASE_TAG" --notes $notes
          }
