name: Publish Drive Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

concurrency:
  group: wikigolf-windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v0.1.0
      RELEASE_ZIP: WikiGOLF-Windows-x64.zip
      DRIVE_FILE_ID: 18y0TYhTjd3txdAZmLxBXI6K3ax9IEekI
    steps:
      - name: Install gdown
        run: python -m pip install --disable-pip-version-check gdown

      - name: Download release from Google Drive
        run: |
          python -m gdown "https://drive.google.com/uc?id=$DRIVE_FILE_ID" -O "$RELEASE_ZIP"
          test -s "$RELEASE_ZIP"
          ls -lh "$RELEASE_ZIP"

      - name: Verify size and hash
        run: |
          SIZE=$(stat -c%s "$RELEASE_ZIP")
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "Release asset exceeds GitHub's 2 GiB per-file limit: $SIZE bytes"
            exit 1
          fi
          sha256sum "$RELEASE_ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Windows x64 release package of WikiGOLF, published from the provided Google Drive Release.zip."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" SHA256SUMS.txt --title "WikiGOLF $RELEASE_TAG" --notes "$NOTES"
          fi
